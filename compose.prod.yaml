# Producción de FEACOMECH en el VPS (el docker-compose.yml de la raíz es sólo para desarrollo).
#
#   docker compose -f compose.prod.yaml up -d --build
#
# - Ningún servicio publica puertos: el tráfico entra por Caddy (/opt/docker/caddy), que
#   comparte la red externa "proxy" con el servicio "app".
# - La base de datos sólo está en la red interna "backend" (sin salida a Internet).
# - Variables en .env (no versionado). Plantilla en SERVER_SETUP.md.
name: feacomech

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb
    logging: *logging

  # Un solo uso en cada despliegue: migraciones + datos iniciales (idempotentes).
  migrate:
    build:
      context: .
      target: migrate
    image: feacomech-migrate:latest
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # El seed de datos reales guarda archivos (portadas de noticias) en el mismo almacén que la app.
      NUXT_ALMACEN: disco
      NUXT_DIR_ALMACEN: /data/almacen
    volumes:
      - almacen:/data/almacen
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging

  app:
    build:
      context: .
      target: runtime
    image: feacomech-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    volumes:
      - almacen:/data/almacen
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      backend:
      proxy:
        aliases: [feacomech-app] # nombre con el que Caddy lo encuentra
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

volumes:
  pg_data:
  almacen:

networks:
  backend:
    internal: true
  proxy:
    external: true
